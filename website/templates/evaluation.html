<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Evaluation | INARA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/evaluation.css">

    <style>
    .inara-nav-links svg, 
    .nav-link-item svg {
        width: 18px !important;
        height: 18px !important;
        min-width: 18px !important;
        min-height: 18px !important;
        display: inline-block !important;
        vertical-align: middle !important;
        margin: 0 !important;
        /* Reset any ring-specific stroke properties */
        stroke-dasharray: none !important;
        stroke: currentColor !important;
        fill: currentColor !important;
    }

    .nav-link-item {
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
    }

    /* Ensure the evaluation rings still work perfectly */
    .ring-wrapper svg {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>
<body class="bg-light">

    {% include "navbar.html" %}

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold mb-1">INARA</h1>
            <p class="fs-4 text-muted">Interview Performance Evaluation</p>
        </div>

        <div class="rings-container">
            <div class="ring-card card-muted" data-key="clarity">
                <div class="ring-wrapper">
                    <svg viewBox="0 0 100 100">
                        <circle class="bg" cx="50" cy="50" r="45"/>
                        <circle class="progress" cx="50" cy="50" r="45"/>
                    </svg>
                    <div class="score">0</div>
                </div>
                <span class="card-title-muted mt-3">Clarity</span>
            </div>

            <div class="ring-card card-muted" data-key="confidence">
                <div class="ring-wrapper">
                    <svg viewBox="0 0 100 100">
                        <circle class="bg" cx="50" cy="50" r="45"/>
                        <circle class="progress" cx="50" cy="50" r="45"/>
                    </svg>
                    <div class="score">0</div>
                </div>
                <span class="card-title-muted mt-3">Confidence</span>
            </div>

            <div class="ring-card card-muted" data-key="conciseness">
                <div class="ring-wrapper">
                    <svg viewBox="0 0 100 100">
                        <circle class="bg" cx="50" cy="50" r="45"/>
                        <circle class="progress" cx="50" cy="50" r="45"/>
                    </svg>
                    <div class="score">0</div>
                </div>
                <span class="card-title-muted mt-3">Conciseness</span>
            </div>

            <div class="ring-card card-muted" data-key="technical">
                <div class="ring-wrapper">
                    <svg viewBox="0 0 100 100">
                        <circle class="bg" cx="50" cy="50" r="45"/>
                        <circle class="progress" cx="50" cy="50" r="45"/>
                    </svg>
                    <div class="score">0</div>
                </div>
                <span class="card-title-muted mt-3">Technical</span>
            </div>

            <div class="ring-card card-muted big" data-key="overall">
                <div class="ring-wrapper">
                    <svg viewBox="0 0 100 100">
                        <circle class="bg" cx="50" cy="50" r="42"/>
                        <circle class="progress primary" cx="50" cy="50" r="42"/>
                    </svg>
                    <div class="score fw-bold">0</div>
                </div>
                <span class="card-title-muted mt-3 fs-5">Overall Score</span>
            </div>
        </div>

        <div class="feedback-section inara-brand-purple p-5 mt-5 shadow-sm rounded-4">
            <h2 class="fw-bold mb-4">Detailed Feedback</h2>
            <p id="feedback-text" class="fs-5 leading-relaxed">Analyzing your interview performance...</p>
            <div class="mt-4">
                <button onclick="window.location.href='/dashboard'" class="btn btn-login btn-lg px-5">
                    Back to Dashboard
                </button>
            </div>
        </div>
    </div>

    <script src="/static/evaluation.js"></script>
    <div class="neon-cursor"></div>
    <div class="neon-cursor-glow"></div>
    <script src="/static/script.js"></script>
</body>
</html>
