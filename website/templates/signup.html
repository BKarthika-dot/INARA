<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign Up | INARA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

  <div class="container-fluid">
    <div class="row vh-100 g-0">

      <div class="col-md-5 d-none d-md-flex align-items-center justify-content-center p-5">
        <div class="text-center w-100">
          <h1 class="display-3 fw-bold">Join INARA</h1>
          <p class="fs-4">Practice smarter, not harder.</p>
          <div class="mt-4 overflow-hidden">
             <img src="/static/image copy.png" class="img-fluid wavy-image-shape" style="max-height: 350px;">
          </div>
        </div>
      </div>

      <div class="col-md-7 d-flex align-items-center justify-content-center inara-brand-purple">
        <div style="width: 100%; max-width: 400px;" class="p-4">
          <div class="mb-4 text-center text-md-start">
            <h2 class="fw-bold">Create Account</h2>
            <p class="text-muted">Start your journey toward your dream job.</p>
          </div>

          <form method="post" action="/signup">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input name="username" class="form-control form-control-lg" placeholder="Choose a handle" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control form-control-lg" placeholder="Create a password" required>
            </div>
            <button class="btn btn-login btn-lg w-100 shadow-sm mt-3">Get Started</button>
            <p class="text-center mt-4">
              Already have an account? <a href="/login" class="text-decoration-none">Log in</a>
            </p>
          </form>

          {% if error %}
            <div class="alert alert-danger mt-3 py-2 text-center">{{ error }}</div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>

</body>
</html>
