<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>INARA – Interview Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">


    <div class="container py-5">
        <div class="row align-items-center" style="min-height: calc(60vh - 60px);">
            <div class="col-md-6 text-center">
                <img src="/static/inara_pic1.avif" alt="Interview Illustration"
                     class="img-fluid wavy-image-shape" style="max-height: 400px;">
            </div>

            <div class="col-md-6 text-md-start text-center">
                <h1 class="display-4 fw-bold letter-hover">INARA</h1>
                <p class="lead">AI-powered interview practice agent</p>
                <div class="mt-4">
                    <a href="/login"  class="btn btn-login  btn-lg me-2">Login</a>
                    <a href="/signup" class="btn btn-signup btn-lg me-2">Sign Up</a>
                </div>
            </div>
        </div>

        <div class="row mt-5 g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm card-muted p-3">
                    <div class="card-body text-center">
                        <h5 class="card-title letter-hover">Real-time Mocking</h5>
                        <p class="card-text text-muted">Practice with an AI that listens and responds to your voice.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm card-muted p-3">
                    <div class="card-body text-center">
                        <h5 class="card-title letter-hover">Performance Analytics</h5>
                        <p class="card-text text-muted">Get a breakdown of your confidence, pace, and content.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm card-muted p-3">
                    <div class="card-body text-center">
                        <h5 class="card-title letter-hover">Tailored Scenarios</h5>
                        <p class="card-text text-muted">Industry-specific questions ranging from Tech to HR.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="neon-cursor"></div>
    <div class="neon-cursor-glow"></div>
    <script src="/static/script.js"></script>
</body>
</html>
