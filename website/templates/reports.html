<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | INARA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* Stat cards */
        .stat-card {
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-4px); }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1;
            color: #4338ca;
        }
        .stat-label {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
            margin-top: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* Toggle buttons */
        .toggle-btn {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }
        .toggle-btn:hover { background: #f1f5f9; }
        .toggle-btn.active {
            border-color: transparent;
            color: white !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .toggle-btn.overall.active     { background: #6366f1; }
        .toggle-btn.clarity.active     { background: #8b5cf6; }
        .toggle-btn.confidence.active  { background: #10b981; }
        .toggle-btn.conciseness.active { background: #f59e0b; }
        .toggle-btn.technical.active   { background: #ef4444; }

        /* Chart container */
        #scoreChart {
            width: 100%;
            height: 400px;
            display: block;
            background: #ffffff;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    {% include "navbar.html" %}

    <div class="container py-5">

        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold mb-1" style="color: #1e1b4b;">INARA</h1>
            <p class="fs-4 text-muted">Performance Insights</p>
        </div>

        <div class="row g-4 mb-5" id="stat-cards">
            <div class="col-6 col-md-3">
                <div class="stat-card shadow-sm">
                    <div class="stat-number" id="stat-streak">—</div>
                    <div class="stat-label">🔥 Current Streak</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card shadow-sm">
                    <div class="stat-number" id="stat-longest">—</div>
                    <div class="stat-label">🏆 Longest Streak</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card shadow-sm">
                    <div class="stat-number" id="stat-sessions">—</div>
                    <div class="stat-label">🎙️ Total Sessions</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card shadow-sm">
                    <div class="stat-number" id="stat-best">—</div>
                    <div class="stat-label">⭐ Best Overall</div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-5 p-4 border-0 rounded-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <h5 class="mb-0 fw-bold" style="color: #1e293b;">Score Progression</h5>
                <div class="d-flex flex-wrap gap-2" id="toggles">
                    <button class="toggle-btn overall active"  data-key="overall">Overall</button>
                    <button class="toggle-btn clarity"         data-key="clarity">Clarity</button>
                    <button class="toggle-btn confidence"      data-key="confidence">Confidence</button>
                    <button class="toggle-btn conciseness"     data-key="conciseness">Conciseness</button>
                    <button class="toggle-btn technical"       data-key="technical">Technical</button>
                </div>
            </div>
            <div id="scoreChart"></div>
        </div>

        <div class="text-center mt-4">
            <button onclick="window.location.href='/dashboard'"
                class="btn btn-lg px-5 shadow-sm"
                style="background:#4338ca; color:#fff; border:none; border-radius:12px;">
                Start New Session
            </button>
        </div>

    </div>

    <div class="neon-cursor"></div>
    <div class="neon-cursor-glow"></div>

    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.27.0/plotly.min.js"></script>
    <script src="/static/reports.js"></script>
    <script src="/static/script.js"></script>

</body>
</html>
