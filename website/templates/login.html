<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login | INARA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

  <div class="container-fluid">
    <div class="row vh-100 g-0">

      <div class="col-md-5 d-none d-md-flex inara-sidebar-blue align-items-center justify-content-center p-5">
        <div class="text-center w-100">
          <h1 class="display-3 fw-bold letter-hover">INARA</h1>
          <p class="fs-4">Elevate your interview game with AI.</p>
          <div class="mt-4 overflow-hidden">
             <img src="/static/image.png" class="img-fluid wavy-image-shape" style="max-height: 350px;">
          </div>
        </div>
      </div>

      <div class="col-md-7 d-flex align-items-center justify-content-center inara-brand-purple">
        <div style="width: 100%; max-width: 400px;" class="p-4">
          <div class="mb-4 text-center text-md-start">
            <h2 class="fw-bold letter-hover">Welcome Back</h2>
            <p class="text-muted">Enter your details to continue practicing.</p>
          </div>

          <form method="post" action="/login">
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input name="username" class="form-control form-control-lg" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>
            <button class="btn btn-login btn-lg w-100 shadow-sm mt-3">Login</button>
            <p class="text-center mt-4">
              Don't have an account? <a href="/signup" class="hover-grow">Sign up</a>
            </p>
          </form>

          {% if request.query_params.get("error") %}
            <div class="alert alert-danger mt-3 py-2 text-center">
              {{ "Incorrect password" if request.query_params.get("error") == "password" else "User does not exist" }}
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
  <div class="neon-cursor"></div>
  <div class="neon-cursor-glow"></div>
  <script src="/static/script.js"></script>
</body>
</html>
